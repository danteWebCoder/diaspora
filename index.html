<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diaspora</title>
    <link rel="stylesheet" href="./src/pages/landing/landing.css">
    <!-- ojo especifidad por orden, siempre despues del style principal por las clases que pisan -->
    <link rel="stylesheet" href="./src/assets/css/global.css">
    <link rel="stylesheet" href="./src/assets/css/fonts.css">
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="backImage  filterGray" id="backImage"></div> <!-- default z -->

    <div class="scrool">
        <div class="maskedBox">
            <div class="background_MASKED filterGray"></div> <!-- z2 -->
        </div>

        <section class="wellcome section_noBack"> <!-- z2 -->
            <div class="contentBox  center">
                <div class="titlesBox">
                    <h1 class="h">FUNDACION</h1>
                    <div class="titlesBox">
                        <h2 class="h">LA DIASPORA</h2>
                        <h3 class="h">EL ARTE COMO MEDIO DE REINDIVICACION DE LOS DERECHOS HUMANOS</h3>
                    </div>
                    <ul class="wordKeys rowSpacing">
                        <li class="word">DERECHOS</li>
                        <li class="separator"></li>
                        <li class="word">ARTE</li>
                        <li class="separator"></li>
                        <li class="word">COMUNIDAD</li>
                    </ul>
                    <ul class="years">
                        <li class="h number">2005</li>
                        <li class="icon"></li>
                        <li class="h number">2026</li>
                    </ul>
                </div>
            </div>
        </section>

        <section class="info section_backWhite center" id="infoSection">
            <div class="back"></div> <!-- z1 -->
            <div class="contentBox center">
                <div class="infoContainer">
                    <div class="imageBox" id="imageBox">
                        <div class="image imageMin max center"></div>
                    </div>
                    <div class="description"></div>
                    <div class="statistics"></div>
                </div>
            </div>
        </section>

        <section class="video section_noBack">
            <div class="contentBox center">
                <h1>VIDEO</h1>
            </div>
        </section>

        <section class="comunity section_backWhite">
            <div class="back"></div>
            <div class="contentBox center">
                <h1>COMUNIDAD</h1>
            </div>
        </section>

        <section class="subscribe center">
            <span class="button center">SUBSCRIBETE</span>
        </section>

        <footer class="center">
            <h1>FOOTER</h1>
        </footer>
    </div>


    <nav class="landingMenu hidden center" id="landingMenu">
        <div class="background_ALPHA menu_max  filterGray"></div>
        <div class="menuBox">
            <div class="logoBox">
                <img class="logo" src="./src/assets/images/logoText-blanco.webp" alt="logo fundacion">
            </div>
            <div class="menuLists">
                <ul class="textMenu">
                    <li class="text center">Fundación</li>
                    <li class="text center">Proyectos</li>
                    <li class="text center">Contacto</li>
                    <li class="text center">Colabora</li>
                </ul>
                <ul class="iconsMenu">
                    <li class="iconBox">
                        <img class="icon" src="./src/assets/icons/nav-facebook.webp">
                    </li>
                    <li class="iconBox">
                        <img class="icon" src="./src/assets/icons/nav-instagram.webp">
                    </li>
                    <li class="iconBox">
                        <img class="icon" src="./src/assets/icons/nav-twitter.webp">
                    </li>
                    <li class="iconBox">
                        <img class="icon" src="./src/assets/icons/nav-youtube.webp">
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script type="module" src="./src/pages/landing/scrollControl.js"></script>
</body>

</html>
